<!DOCTYPE html>
<html lang="eng">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #a7c0e4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .login-box {
            background: rgb(178, 209, 237);
            padding: 32px 28px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
            border: 1px solid #000000;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 24px;
            font-size: 1.6rem;
            color: #222;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            margin-bottom: 14px;
            border: 1px solid #000000;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #4CAF50;
        }

        button {
            width: 100%;
            padding: 13px;
            background-color: #fffbfb;
            color: #000;
            border: 1px solid #000000;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.15s;
            margin-top: 4px;
        }

        button:hover {
            background-color: #45a049;
            color: white;
        }

        button:active {
            transform: scale(0.98);
        }

        #message {
            margin-top: 16px;
            font-weight: bold;
            min-height: 24px;
            font-size: 15px;
        }

        .success {
            color: #2e7d32;
        }

        .error {
            color: #e74c3c;
        }
        
        @media (max-width: 380px) {
            .login-box {
                padding: 24px 18px;
            }

            .login-box h2 {
                font-size: 1.4rem;
            }

            input, button {
                font-size: 14.5px;
                padding: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Login</h2>

        <input type="text" id="username" placeholder="Username" autocomplete="username">
        <input type="password" id="password" placeholder="Password" autocomplete="current-password">

        <button onclick="checkLogin()">Login</button>

        <div id="message"></div>
    </div>

    <script>
        function checkLogin() {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const message = document.getElementById("message");

            if (username === "me" && password === "me123") {
                message.textContent = "Login successful!";
                message.className = "success";
            } else {
                message.textContent = "Invalid username or password!";
                message.className = "error";
            }
        }

        document.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkLogin();
            }
        });
    </script>

</body>
</html>
